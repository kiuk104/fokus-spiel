# push 마다 build.py 를 돌려 GitHub Pages 에 배포한다.
# 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 두어야 한다.
name: Build & deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # 갱신일을 git 이력에서 읽기 위해 전체 이력
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install markdown
      - run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with: { path: . }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
